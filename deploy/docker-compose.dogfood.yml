# =============================================================================
# Customer-Ops — DOGFOOD production deploy (host: bigboy / SSH alias magicunicorn)
# =============================================================================
# Public host : customer-ops.magicunicorn.dev   (wildcard *.magicunicorn.dev
#               already resolves to bigboy — NO new DNS record needed)
# Reverse proxy: Traefik v3.6 (project "traefik-bigboy"), external network "web",
#               entrypoint "websecure" (443), certresolver "letsencrypt".
#               Matched 1:1 from the live siblings project-ops + contact-ops.
#
# ROUTING (matches the app's own config — NEXT_PUBLIC_API_URL=.../api/v1 and the
# Keycloak callback /api/v1/auth/keycloak/callback are SAME-HOST path routes):
#   customer-ops.magicunicorn.dev/api/**  -> customer-ops-backend  :3211  (priority 100)
#   customer-ops.magicunicorn.dev/**      -> customer-ops-frontend :3000  (catch-all)
# The /api router carries a higher explicit priority so it wins over the SPA
# catch-all. The prefix is NOT stripped — the NestJS global prefix is `api/v1`,
# so Traefik forwards the full path through.
#
# (project-ops instead splits the API onto api.projectops.magicunicorn.dev. We
#  deliberately did NOT copy that here: Customer-Ops' frontend bakes
#  NEXT_PUBLIC_API_URL=https://customer-ops.magicunicorn.dev/api/v1 and its
#  Keycloak callback is a /api/v1 path, so same-host path routing is the match
#  that needs ZERO app-config or second-cert changes. To switch to a subdomain
#  later, see DEPLOY.md "Alternative: API subdomain".)
#
# Bring up:  docker compose -f deploy/docker-compose.dogfood.yml up -d --build
# (run from the repo ROOT so the ../backend / ../frontend build contexts resolve)
# =============================================================================

# Pin the project name so container/network/volume names are stable regardless
# of the directory the command is run from (sibling-style determinism).
name: customer-ops

services:
  # ---------------------------------------------------------------------------
  # Postgres 17 — private (NOT on web). First boot runs infrastructure/database/
  # init/*.sql as superuser, which pre-creates the customer_ops_* role split and
  # the shared extensions. Prisma `migrate deploy` (run by the backend on start)
  # owns the actual schema + RLS + grants.
  # ---------------------------------------------------------------------------
  customer-ops-postgres:
    image: postgres:17
    container_name: customer-ops-postgres
    restart: unless-stopped
    environment:
      # The object-owner / admin role the runtime + migrations connect as in
      # Phase 1 (DATABASE_URL/ADMIN_DATABASE_URL use customer_ops_admin).
      POSTGRES_USER: customer_ops_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: customerops
    volumes:
      - customer-ops-pgdata:/var/lib/postgresql/data
      # First-boot init (role split + extensions). Idempotent; ignored if the
      # data volume already exists.
      - ../infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_ops_admin -d customerops"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis 7 — the shared-state plane. This stack drops the backend's
  # container_name and invites `--scale customer-ops-backend=N`, so the backend's
  # single-use nonces / Relations-Officer pending confirms / rate-limit counters
  # MUST live off-process — otherwise a 2nd replica reintroduces the exact
  # in-process replay / lost-confirm / split-budget bugs the reliability work
  # fixes. Private (NOT on web); appendonly persistence so a pending confirm
  # survives a restart. The backend reads it via REDIS_URL below.
  # ---------------------------------------------------------------------------
  customer-ops-redis:
    image: redis:7-alpine
    container_name: customer-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - customer-ops-redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend — NestJS (port 3211). On start: `prisma migrate deploy` then
  # `node dist/main`. Routed by Traefik on the SAME host under /api.
  # ---------------------------------------------------------------------------
  customer-ops-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # NO container_name: a pinned name forbids a 2nd instance (Docker requires
    # unique container names), so `docker compose up --scale customer-ops-backend=N`
    # would fail. Compose derives a unique per-replica name; Traefik discovers the
    # replicas by label and load-balances them. The backend is stateless — shared
    # state (single-use nonces / pending confirms / rate limits) lives in Redis,
    # wired via REDIS_URL below to the in-stack customer-ops-redis — so replicas
    # are interchangeable. Scaling without this shared plane is UNSAFE.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The shared-state plane (see customer-ops-redis). Set here so this stack is
      # scale-safe out of the box; override in .env to point at an external Redis.
      - REDIS_URL=${REDIS_URL:-redis://customer-ops-redis:6379}
    # Tenancy go-live (flipped 2026-06-20): the runtime DATABASE_URL is now the
    # NOBYPASSRLS `customer_ops_app` role, which has NO DDL rights — so run
    # `prisma migrate deploy` under ADMIN_DATABASE_URL (customer_ops_admin), then
    # start the app under DATABASE_URL. `$$` defers expansion to the container
    # shell (compose turns `$$`->`$`); ADMIN_DATABASE_URL comes from env_file.
    # Mirrors docker-compose.prod.yml, which always shipped this hardened form.
    command: ["sh", "-c", "DATABASE_URL=\"$${ADMIN_DATABASE_URL}\" npx prisma migrate deploy && node dist/main"]
    expose:
      - "3211"
    depends_on:
      customer-ops-postgres:
        condition: service_healthy
      customer-ops-redis:
        condition: service_healthy
    networks:
      - internal
      - web
      # Shared FalkorDB network (external) — reach unicorn-falkordb for the graph.
      - unicorn-network
    healthcheck:
      # Node 20-alpine has neither curl nor wget by default; use a tiny node probe.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3211/api/v1/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # API on the same host, higher priority than the SPA catch-all. Prefix is
      # forwarded intact (NestJS global prefix = api/v1).
      - "traefik.http.routers.customer-ops-backend.rule=Host(`customer-ops.magicunicorn.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.customer-ops-backend.priority=100"
      - "traefik.http.routers.customer-ops-backend.entrypoints=websecure"
      - "traefik.http.routers.customer-ops-backend.tls=true"
      - "traefik.http.routers.customer-ops-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.customer-ops-backend.loadbalancer.server.port=3211"

  # ---------------------------------------------------------------------------
  # Frontend — Next.js standalone (port 3000). SPA catch-all on the host root.
  # NEXT_PUBLIC_API_URL is inlined at BUILD time (Next bakes NEXT_PUBLIC_*), so
  # it is passed as a build arg, sourced from the env file.
  # ---------------------------------------------------------------------------
  customer-ops-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://customer-ops.magicunicorn.dev/api/v1}
    container_name: customer-ops-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - customer-ops-backend
    networks:
      - web
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.customer-ops-frontend.rule=Host(`customer-ops.magicunicorn.dev`)"
      - "traefik.http.routers.customer-ops-frontend.entrypoints=websecure"
      - "traefik.http.routers.customer-ops-frontend.tls=true"
      - "traefik.http.routers.customer-ops-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.customer-ops-frontend.loadbalancer.server.port=3000"
      # Alias: customerops.magicunicorn.dev -> 301 -> the canonical customer-ops host
      # (one session/cookie/SSO origin; both typed URLs still land you in the app).
      - "traefik.http.routers.customer-ops-alias.rule=Host(`customerops.magicunicorn.dev`)"
      - "traefik.http.routers.customer-ops-alias.entrypoints=websecure"
      - "traefik.http.routers.customer-ops-alias.tls=true"
      - "traefik.http.routers.customer-ops-alias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.customer-ops-alias.service=customer-ops-frontend"
      - "traefik.http.routers.customer-ops-alias.middlewares=customer-ops-canonical"
      - "traefik.http.middlewares.customer-ops-canonical.redirectregex.regex=^https?://customerops\\.magicunicorn\\.dev/(.*)"
      - "traefik.http.middlewares.customer-ops-canonical.redirectregex.replacement=https://customer-ops.magicunicorn.dev/$${1}"
      - "traefik.http.middlewares.customer-ops-canonical.redirectregex.permanent=true"

volumes:
  customer-ops-pgdata:
    name: customer-ops-pgdata
  customer-ops-redisdata:
    name: customer-ops-redisdata

networks:
  # The EXISTING external Traefik ingress network (verified via docker inspect
  # traefik -> attached to "web"; all siblings join it). Must already exist.
  web:
    external: true
  # App-private network for backend <-> postgres. Created by this compose.
  internal:
    name: customer-ops-internal
    driver: bridge
  # The shared FalkorDB network (external; project uc-cloud-production) — lets the
  # backend reach unicorn-falkordb at redis://unicorn-falkordb:6379 for the
  # knowledge-graph layer. Must already exist on the host (it does: falkordb is on it).
  unicorn-network:
    external: true
